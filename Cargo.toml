[package]
name = "tool"
version = "0.1.0"
edition = "2024"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.100"
tokio = { version = "1.52.0", features = ["signal", "macros"], optional = true }
serde = { version = "1.0.228", features = ["derive"], optional = true }
serde_json = { version = "1.0.149", optional = true }
tracing = { version = "0.1.44", optional = true }
tracing-subscriber = { version = "0.3.22", optional = true }
tracing-appender = { version = "0.2.4", optional = true }
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "mysql"], optional = true }
chrono = { version = "0.4.42", optional = true }
amqprs = { version = "2.1.3", optional = true }
base64 = { version = "0.22.1", optional = true }
async-trait = { version = "0.1.89", optional = true }
log = { version = "0.4.29", optional = true }
reqwest = { version = "0.12.28", features = ["json", "cookies", "rustls-tls", "multipart", "blocking"], default-features = false, optional = true }
reqwest_cookie_store = { version = "0.9.0", optional = true }
cookie_store = { version = "0.22.0", optional = true }
hex = { version = "0.4.3", optional = true }
ecb = { version = "0.1.2", optional = true }
cbc = { version = "0.1.2", optional = true }
aes = { version = "0.8.4", optional = true }
lettre = { version = "0.11.21", features = ["builder", "smtp-transport", "tokio1-rustls-tls", "hostname", "pool"], default-features = false, optional = true }
derive_builder = { version = "0.20.2", optional = true }
zip = { version = "7.0.0", features = ["deflate"], default-features = false, optional = true }
mime = { version = "0.3.17", optional = true }
blake3 = { version = "1.8.3", optional = true }
paste = { version = "1.0.15", optional = true }
rust_decimal = { version = "1.39.0", optional = true }
calamine = { version = "0.32.0", optional = true }
regex = { version = "1.11.1", optional = true }
parking_lot = { version = "0.12.5", optional = true }
rand = { version = "0.9.1", optional = true }
thiserror = { version = "2.0.17", optional = true }
aes-gcm = { version = "0.11.0", optional = true }
hmac = { version = "0.12", optional = true }
sha2 = { version = "0.10", optional = true }
uuid = { version = "1", optional = true, features = ["v4"] }
url = { version = "2", optional = true }
http = { version = "1", optional = true }

[features]
default = ["zlog"]
full = ["zlog", "database", "serialize", "session", "mq", "crypto", "mail", "zip", "xls_reader", "sre_breaker", "signal"]
zlog = ["log", "tracing", "tracing-subscriber", "tracing-appender", "chrono"]
database = ["sqlx", "log", "derive_builder", "serde"]
serialize = ["serde", "serde_json", "paste", "rust_decimal"]
session = ["reqwest", "reqwest_cookie_store", "cookie_store", "serde_json"]
mq = ["amqprs", "base64", "log", "serde", "serde_json", "async-trait", "derive_builder"]
mail = ["lettre", "derive_builder", "mime", "serde", "thiserror", "base64"]
crypto = ["aes", "ecb", "cbc", "hex", "base64", "blake3", "aes-gcm", "hmac", "sha2", "uuid", "url", "http"]
xls_reader = ["calamine", "regex"]
sre_breaker = ["parking_lot", "derive_builder", "thiserror", "rand"]
signal = ["tokio", "log"]
